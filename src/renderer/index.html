<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Registry Browser</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #1e1e1e;
      color: #d4d4d4;
      height: 100vh;
      overflow: hidden;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .header {
      background: #252526;
      padding: 12px 20px;
      border-bottom: 1px solid #3e3e42;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      font-size: 18px;
      font-weight: 500;
    }

    .header-buttons {
      display: flex;
      gap: 10px;
    }

    button {
      background: #0e639c;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.2s;
    }

    button:hover {
      background: #1177bb;
    }

    button:disabled {
      background: #464647;
      cursor: not-allowed;
    }

    button.secondary {
      background: #3e3e42;
    }

    button.secondary:hover {
      background: #505052;
    }

    button.danger {
      background: #a1260d;
    }

    button.danger:hover {
      background: #c42b1c;
    }

    button.danger:disabled {
      background: #464647;
    }

    .main-content {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .login-screen,
    .browser-screen {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-form {
      background: #252526;
      padding: 40px;
      border-radius: 8px;
      width: 400px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    .login-form h2 {
      margin-bottom: 24px;
      text-align: center;
      color: #cccccc;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      color: #cccccc;
      font-size: 13px;
    }

    .form-group input {
      width: 100%;
      padding: 8px 12px;
      background: #3c3c3c;
      border: 1px solid #3e3e42;
      border-radius: 3px;
      color: #d4d4d4;
      font-size: 13px;
    }

    .form-group input:focus {
      outline: none;
      border-color: #0e639c;
    }

    .form-group input::placeholder {
      color: #858585;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
    }

    .checkbox-group input[type="checkbox"] {
      width: auto;
    }

    .checkbox-group label {
      margin: 0;
      cursor: pointer;
    }

    .button-group {
      display: flex;
      gap: 10px;
    }

    .button-group button {
      flex: 1;
    }

    .error-message {
      background: #5a1d1d;
      color: #f48771;
      padding: 10px;
      border-radius: 3px;
      margin-bottom: 16px;
      font-size: 13px;
      border: 1px solid #be1100;
    }

    .success-message {
      background: #1d5a1d;
      color: #71f487;
      padding: 10px;
      border-radius: 3px;
      margin-bottom: 16px;
      font-size: 13px;
      border: 1px solid #00be11;
    }

    .browser-layout {
      display: flex;
      width: 100%;
      height: 100%;
    }

    .sidebar {
      width: 300px;
      background: #252526;
      border-right: 1px solid #3e3e42;
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 12px 16px;
      border-bottom: 1px solid #3e3e42;
      font-weight: 500;
      color: #cccccc;
    }

    .repository-list {
      flex: 1;
      overflow-y: auto;
    }

    .repository-item {
      padding: 10px 16px;
      cursor: pointer;
      border-bottom: 1px solid #2d2d30;
      transition: background 0.2s;
    }

    .repository-item:hover {
      background: #2a2d2e;
    }

    .repository-item.active {
      background: #094771;
      border-left: 2px solid #0e639c;
    }

    .content-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .content-header {
      padding: 12px 20px;
      border-bottom: 1px solid #3e3e42;
      background: #252526;
    }

    .content-header h2 {
      font-size: 16px;
      font-weight: 500;
      color: #cccccc;
    }

    .content-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .tags-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
    }

    .tag-card {
      background: #252526;
      border: 1px solid #3e3e42;
      border-radius: 4px;
      padding: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tag-card:hover {
      border-color: #0e639c;
      transform: translateY(-2px);
    }

    .tag-name {
      font-weight: 500;
      margin-bottom: 8px;
      color: #4ec9b0;
    }

    .manifest-details {
      background: #252526;
      border: 1px solid #3e3e42;
      border-radius: 4px;
      padding: 16px;
      margin-top: 12px;
    }

    .manifest-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .manifest-details h3 {
      font-size: 14px;
      color: #4ec9b0;
    }

    .manifest-details pre {
      background: #1e1e1e;
      padding: 12px;
      border-radius: 3px;
      overflow-x: auto;
      font-size: 12px;
      color: #d4d4d4;
    }

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      color: #858585;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      color: #858585;
      text-align: center;
    }

    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    .hidden {
      display: none;
    }

    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    ::-webkit-scrollbar-track {
      background: #1e1e1e;
    }

    ::-webkit-scrollbar-thumb {
      background: #424242;
      border-radius: 5px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #4e4e4e;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <h1>🐳 Registry Browser</h1>
      <div class="header-buttons">
        <button id="aboutBtn">About</button>
      </div>
    </div>

    <div class="main-content">
      <!-- Login Screen -->
      <div id="loginScreen" class="login-screen">
        <div class="login-form">
          <h2>Connect to Registry</h2>
          <div id="loginError" class="error-message hidden"></div>
          <div id="loginSuccess" class="success-message hidden"></div>
          
          <div class="form-group">
            <label for="registryUrl">Registry URL</label>
            <input 
              type="text" 
              id="registryUrl" 
              placeholder="https://registry.example.com"
              value="http://localhost:5000"
            />
          </div>

          <div class="form-group">
            <label for="username">Username</label>
            <input 
              type="text" 
              id="username" 
              placeholder="username"
            />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input 
              type="password" 
              id="password" 
              placeholder="password"
            />
          </div>

          <div class="checkbox-group">
            <input type="checkbox" id="saveCredentials" />
            <label for="saveCredentials">Save credentials locally</label>
          </div>

          <div class="button-group">
            <button id="connectBtn">Connect</button>
          </div>
        </div>
      </div>

      <!-- Browser Screen -->
      <div id="browserScreen" class="browser-screen hidden">
        <div class="browser-layout">
          <div class="sidebar">
            <div class="sidebar-header">
              Repositories
              <button id="disconnectBtn" class="secondary" style="float: right; padding: 4px 10px; font-size: 11px;">Disconnect</button>
            </div>
            <div id="repositoryList" class="repository-list">
              <div class="loading">Loading repositories...</div>
            </div>
          </div>

          <div class="content-area">
            <div class="content-header">
              <h2 id="contentTitle">Select a repository</h2>
            </div>
            <div id="contentBody" class="content-body">
              <div class="empty-state">
                <div class="empty-state-icon">📦</div>
                <p>Select a repository from the sidebar to view its tags and images</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../../dist/renderer/renderer.js"></script>
</body>
</html>
